<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#dcebf6" />
    <meta name="description" content="Prototipe pendamping gizi balita: catat pertumbuhan dan rencanakan menu sesuai anggaran." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tumbuh" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="app-icon.svg" />
    <title>Tumbuh: Teman tumbuh kembang keluarga</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#home" aria-label="Tumbuh beranda">
          <span class="brand-mark" aria-hidden="true">t</span>
          <span>tumbuh<span class="brand-period">.</span></span>
        </a>
        <div class="topbar-right">
          <span class="offline-label"><span></span> Tersimpan di perangkat</span>
          <button class="install-button" id="installApp" type="button">Pasang aplikasi</button>
          <button class="account-button" id="accountShortcut" type="button">Sign in / Sign up</button>
        </div>
      </header>

      <main id="app" tabindex="-1"></main>

      <nav class="bottom-nav" aria-label="Navigasi utama">
        <button class="nav-item active" data-page="home"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3.5 10 8.5-7 8.5 7"/><path d="M5.5 9.2V20h13V9.2"/><path d="M9.5 20v-6h5v6"/></svg><span>Beranda</span></button>
        <button class="nav-item" data-page="growth"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5h16M5 19.5V5"/><path d="m7.5 15.5 3.2-3.3 3.1 1.7 4.7-6.2"/><circle cx="7.5" cy="15.5" r="1"/><circle cx="18.5" cy="7.7" r="1"/></svg><span>Tumbuh</span></button>
        <button class="nav-item" data-page="doctors"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4.5v4a4 4 0 0 0 8 0v-4"/><path d="M4.5 4.5H7M13 4.5h2.5"/><path d="M10 12.5V14a4 4 0 0 0 8 0v-1"/><circle cx="18" cy="10.5" r="1.8"/></svg><span>Konsultasi</span></button>
        <button class="nav-item" data-page="discussion"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h10A2.5 2.5 0 0 1 19 5.5v6a2.5 2.5 0 0 1-2.5 2.5H10l-5 3v-3A2.5 2.5 0 0 1 3 11.5v-6"/><path d="M9 17h6l4 2.5V16"/></svg><span>Diskusi</span></button>
        <button class="nav-item" data-page="consult"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="3.5" width="19" height="17" rx="4"/><path d="m6.5 16 2.2-8 2.2 8M7.3 13h2.8M14.5 8v8M13.5 8h2M13.5 16h2"/></svg><span>Tanya AI</span></button>
      </nav>
      <div class="account-modal-backdrop" id="accountModal" hidden>
        <section class="account-modal" role="dialog" aria-modal="true" aria-labelledby="accountTitle">
          <div class="account-modal-heading"><div><p class="eyebrow">Profil Tumbuh</p><h2 id="accountTitle">Sign in / Sign up</h2></div><button class="modal-close" type="button" data-action="close-account" aria-label="Tutup">×</button></div>
          <div class="account-tabs"><button type="button" class="account-tab active" data-action="account-mode" data-mode="signup">Sign up</button><button type="button" class="account-tab" data-action="account-mode" data-mode="signin">Sign in</button></div>
          <div id="accountFormHost"></div>
          <button class="text-button guest-button" type="button" data-action="continue-guest">Lanjut tanpa akun</button>
          <p class="account-note">Profil disimpan hanya di browser/perangkat ini. Email belum diverifikasi dan data tidak tersinkron ke perangkat lain.</p>
        </section>
      </div>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </div>
    <script src="growth-reference-data.js"></script>
    <script src="menu-data.js"></script>
    <script src="chatbot-data.js"></script>
    <script src="food-analysis-config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
